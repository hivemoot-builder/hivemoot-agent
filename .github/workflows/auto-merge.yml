name: Auto-merge

on:
  # Trigger when merge-ready label is added
  pull_request_target:
    types: [labeled]
  # Trigger when CI workflow completes (check_suite doesn't fire for Actions)
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge ready PRs
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.label.name == 'hivemoot:merge-ready') ||
      github.event_name == 'workflow_run'
    steps:
      - name: Find and merge ready PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Find open PRs with the merge-ready label
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 10,
            });

            const readyPRs = prs.filter(pr =>
              pr.labels.some(l => l.name === 'hivemoot:merge-ready')
            );

            if (readyPRs.length === 0) {
              console.log('No merge-ready PRs found');
              return;
            }

            for (const pr of readyPRs) {
              console.log(`Checking PR #${pr.number}: ${pr.title}`);

              // Verify mergeable state
              const { data: detail } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });

              if (detail.mergeable_state !== 'clean') {
                console.log(`  Skip: mergeable_state=${detail.mergeable_state}`);
                continue;
              }

              // Verify all required checks passed
              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
              });

              if (checks.check_runs.length === 0) {
                console.log('  Skip: no check runs found for HEAD SHA');
                continue;
              }

              const pending = checks.check_runs.filter(
                c => c.status !== 'completed'
              );
              const failed = checks.check_runs.filter(
                c => c.status === 'completed' && c.conclusion !== 'success'
                  && c.conclusion !== 'skipped'
              );

              if (pending.length > 0) {
                console.log(`  Skip: ${pending.length} checks still pending`);
                continue;
              }

              if (failed.length > 0) {
                const names = failed.map(c => c.name).join(', ');
                console.log(`  Skip: failed checks: ${names}`);
                continue;
              }

              // Verify minimum approvals (2, matching hivemoot.yml).
              // Only count approvals from trusted associations (collaborators,
              // org members, owners) to prevent external accounts from
              // satisfying the approval gate on public repos.
              const TRUSTED_ASSOCIATIONS = new Set([
                'COLLABORATOR', 'MEMBER', 'OWNER',
              ]);

              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: pr.number, per_page: 100 }
              );

              const approvals = new Set();
              for (const review of reviews) {
                if (!TRUSTED_ASSOCIATIONS.has(review.author_association)) {
                  continue;
                }
                if (review.state === 'APPROVED') {
                  approvals.add(review.user.login);
                } else if (review.state === 'CHANGES_REQUESTED') {
                  approvals.delete(review.user.login);
                } else if (review.state === 'DISMISSED') {
                  approvals.delete(review.user.login);
                }
              }
              // Exclude PR author self-approval
              approvals.delete(detail.user.login);

              if (approvals.size < 2) {
                console.log(`  Skip: only ${approvals.size} approvals (need 2)`);
                continue;
              }

              // Merge with SHA pinning to prevent TOCTOU race
              console.log(`  Merging PR #${pr.number} (${approvals.size} approvals)`);
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  sha: detail.head.sha,
                });
                console.log(`  Merged successfully`);

                // Delete the head branch if it's in this repo
                if (detail.head.repo?.full_name === `${owner}/${repo}`) {
                  try {
                    await github.rest.git.deleteRef({
                      owner,
                      repo,
                      ref: `heads/${detail.head.ref}`,
                    });
                    console.log(`  Deleted branch: ${detail.head.ref}`);
                  } catch (e) {
                    console.log(`  Could not delete branch: ${e.message}`);
                  }
                }
              } catch (e) {
                console.log(`  Merge failed: ${e.message}`);
              }
            }
