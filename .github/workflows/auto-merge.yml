name: Auto-merge

on:
  # Trigger when merge-ready label is added or CI completes on a labeled PR
  pull_request_target:
    types: [labeled]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge ready PRs
    runs-on: ubuntu-latest
    # Only run when the triggering label is merge-ready, or when a check suite
    # completes (to catch PRs that were labeled before CI finished).
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.label.name == 'hivemoot:merge-ready') ||
      github.event_name == 'check_suite'
    steps:
      - name: Find and merge ready PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Find open PRs with the merge-ready label
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              sort: 'created',
              direction: 'asc',
              per_page: 10,
            });

            const readyPRs = prs.filter(pr =>
              pr.labels.some(l => l.name === 'hivemoot:merge-ready')
            );

            if (readyPRs.length === 0) {
              console.log('No merge-ready PRs found');
              return;
            }

            for (const pr of readyPRs) {
              console.log(`Checking PR #${pr.number}: ${pr.title}`);

              // Verify mergeable state
              const { data: detail } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });

              if (detail.mergeable_state !== 'clean') {
                console.log(`  Skip: mergeable_state=${detail.mergeable_state}`);
                continue;
              }

              // Verify all required checks passed
              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
              });

              const pending = checks.check_runs.filter(
                c => c.status !== 'completed'
              );
              const failed = checks.check_runs.filter(
                c => c.status === 'completed' && c.conclusion !== 'success'
                  && c.conclusion !== 'skipped'
              );

              if (pending.length > 0) {
                console.log(`  Skip: ${pending.length} checks still pending`);
                continue;
              }

              if (failed.length > 0) {
                const names = failed.map(c => c.name).join(', ');
                console.log(`  Skip: failed checks: ${names}`);
                continue;
              }

              // Verify minimum approvals (2, matching hivemoot.yml)
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: pr.number,
              });

              const approvals = new Set();
              for (const review of reviews) {
                if (review.state === 'APPROVED') {
                  approvals.add(review.user.login);
                } else if (review.state === 'CHANGES_REQUESTED') {
                  approvals.delete(review.user.login);
                }
              }

              if (approvals.size < 2) {
                console.log(`  Skip: only ${approvals.size} approvals (need 2)`);
                continue;
              }

              // Merge
              console.log(`  Merging PR #${pr.number} (${approvals.size} approvals)`);
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                console.log(`  Merged successfully`);

                // Delete the head branch if it's in this repo
                if (detail.head.repo?.full_name === `${owner}/${repo}`) {
                  try {
                    await github.rest.git.deleteRef({
                      owner,
                      repo,
                      ref: `heads/${detail.head.ref}`,
                    });
                    console.log(`  Deleted branch: ${detail.head.ref}`);
                  } catch (e) {
                    console.log(`  Could not delete branch: ${e.message}`);
                  }
                }
              } catch (e) {
                console.log(`  Merge failed: ${e.message}`);
              }
            }
